version: '3'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: CP_container
    volumes:
      - ./static:/app/static
      - ./media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

    restart: always
    networks:
      - CP_network
  db:
    image: postgis/postgis:15-3.4
    container_name: CP_postgis_container
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env.db
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - CP_network

networks:
  CP_network:
    driver: bridge

volumes:
  postgres_data:

      