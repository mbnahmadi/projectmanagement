version: '3.9'

services:
  web:
    build: .
      # context: .
      # dockerfile: Dockerfile
    container_name: CP_django_container
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
      - ./static_volume:/app/static
      - ./media_volume:/app/media
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

    restart: always
    networks:
      - CP_network

  celery:
    build: .
    container_name: CP_celery_worker_container
    command: celery -A config worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  celery_beat:
    build: .
    container_name: CP_celery_beat_container
    command: celery -A config beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgis/postgis:16-3.5
    container_name: CP_postgis_container
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "5432:5432"
    restart: always
    networks:
      - CP_network

  redis:
    image: redis:7-alpine
    container_name: CP_redis_server_container
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

networks:
  CP_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

      